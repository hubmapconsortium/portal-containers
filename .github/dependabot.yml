version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # One docker and one pip entry per container, so every Dependabot PR touches a
  # single container (each needs its own VERSION + dockerPull bump to release).
  # pip is security-only (open-pull-requests-limit: 0 turns off version updates);
  # the "*" group folds all of a container's security fixes into one PR.

  - package-ecosystem: "docker"
    directory: "/containers/anndata-to-ui"
    schedule:
      interval: "monthly"
  - package-ecosystem: "pip"
    directory: "/containers/anndata-to-ui/context"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    groups:
      anndata-to-ui-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/containers/h5ad-to-arrow"
    schedule:
